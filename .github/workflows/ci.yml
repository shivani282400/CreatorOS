name: CreatorOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    # Postgres with the pgvector extension, used by the integration tests.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
          POSTGRES_DB: creatoros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator -d creatoros_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: CreatorOS-backend

    env:
      TEST_DATABASE_URL: postgres://creator:creator@localhost:5432/creatoros_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CreatorOS-backend/package-lock.json

      - run: npm ci
      # Builds, then runs unit tests + OTP tests + the end-to-end suite (real Postgres, mock AI provider).
      - run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: CreatorOS-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: CreatorOS-frontend/package-lock.json

      - run: npm ci
      - run: npm run build
